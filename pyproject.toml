[project]
name = "railpilot"
dynamic = ["version"]
description = "Local-first, security-focused 12306 assistant"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "playwright>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6,<7; sys_platform == 'win32'"]

[project.scripts]
railpilot = "railpilot.cli:main"
railpilot-gui = "railpilot.gui.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "railpilot.__version__"}

[tool.setuptools.packages.find]
include = ["railpilot*"]
