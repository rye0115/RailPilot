[project]
name = "railpilot"
version = "0.1.0"
description = "Local-first, security-focused 12306 assistant"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "playwright>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
railpilot = "railpilot.cli:main"
railpilot-gui = "railpilot.gui.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
